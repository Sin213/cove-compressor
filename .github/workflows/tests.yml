name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Neither hosted image ships ffmpeg/ffprobe, and the suite drives both
      # for real (probes, encodes, cover-art fixtures).
      - name: Install ffmpeg and ffprobe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      # The same gyan.dev build the Windows release bundles, with the
      # GitHub-hosted BtbN build as the fallback. Appending to GITHUB_PATH is
      # what makes the tools visible to every later step.
      - name: Install ffmpeg and ffprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $dest 'ffmpeg.zip'
          $urls = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ok = $false
          foreach ($url in $urls) {
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              & curl.exe --silent --show-error --fail --location --output $zip $url
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds (5 * $i) }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw 'Could not download an ffmpeg build from any source' }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $probe = Get-ChildItem -Path $dest -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $probe) { throw 'ffprobe.exe is not in the downloaded archive' }
          Add-Content -Path $env:GITHUB_PATH -Value $probe.DirectoryName

      - name: Verify ffmpeg and ffprobe are on PATH
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
          python - <<'PY'
          import shutil, subprocess, sys

          paths = {t: shutil.which(t) for t in ("ffmpeg", "ffprobe")}
          print(paths)
          missing = [t for t, p in paths.items() if not p]
          if missing:
              sys.exit(f"not resolvable from PATH: {missing}")
          encoders = subprocess.run(
              [paths["ffmpeg"], "-hide_banner", "-encoders"],
              capture_output=True, text=True, check=True,
          ).stdout
          absent = [e for e in ("libx264", "libx265", "libvpx-vp9") if e not in encoders]
          if absent:
              sys.exit(f"ffmpeg lacks encoders the suite needs: {absent}")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider tests
